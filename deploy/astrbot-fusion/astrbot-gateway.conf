# Include inside the existing Manager Nginx http block. Keep its current
# 443/8002 servers and TLS mount; publish only this additional HTTPS listener.
# A separate port also isolates AstrBot's localStorage token from Manager's.
map $http_upgrade $youmi_astrbot_connection {
    default upgrade;
    '' close;
}

server {
    listen 6186 ssl;
    server_name _;
    ssl_certificate /etc/mia-tls/live/mia-personal-ip/fullchain.pem;
    ssl_certificate_key /etc/mia-tls/live/mia-personal-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Native plugin views and SSE may carry scoped tokens in URLs.
    access_log off;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $youmi_astrbot_upstream astrbot:6185;

    location / {
        proxy_pass http://$youmi_astrbot_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 6186;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $youmi_astrbot_connection;
        proxy_buffering off;
        proxy_read_timeout 3600;
    }
}
