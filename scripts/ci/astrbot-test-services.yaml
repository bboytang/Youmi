name: youmi-astrbot-tests
services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    environment:
      MYSQL_ROOT_PASSWORD: youmi-ci-only
      MYSQL_DATABASE: youmi_esp32_server
    ports: ["127.0.0.1:3306:3306"]
    tmpfs: ["/var/lib/mysql:rw,size=512m"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pyoumi-ci-only"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  redis:
    image: public.ecr.aws/docker/library/redis:8@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 128m
