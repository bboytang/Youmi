name: Verify owner-managed Youmi persona
on:
  push:
    paths:
      - 'integrations/astrbot_plugin_youmi/admin.py'
      - 'integrations/tests/test_persona_owner_lock.py'
      - '.github/workflows/youmi-persona-owner.yml'
  pull_request:
    paths:
      - 'integrations/astrbot_plugin_youmi/admin.py'
      - 'integrations/tests/test_persona_owner_lock.py'
      - '.github/workflows/youmi-persona-owner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persona-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aiohttp==3.14.3 pytest==9.1.1 pytest-asyncio==1.4.0
      - run: python -m pytest integrations/tests/test_persona_owner_lock.py integrations/tests/test_admin_api.py -q
