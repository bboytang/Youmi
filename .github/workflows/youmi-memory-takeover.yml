name: Verify Youmi memory takeover compatibility

on:
  push:
    paths:
      - 'server/companion/**'
      - 'server/tests/test_companion_*.py'
      - 'server/tests/companion_schema_fixtures.py'
      - 'server/tests/test_emotional_system.py'
      - 'server/tests/test_notebook_management.py'
      - '.github/workflows/youmi-memory-takeover.yml'
  pull_request:
    paths:
      - 'server/companion/**'
      - 'server/tests/test_companion_*.py'
      - 'server/tests/companion_schema_fixtures.py'
      - 'server/tests/test_emotional_system.py'
      - 'server/tests/test_notebook_management.py'
      - '.github/workflows/youmi-memory-takeover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==1.26.4 aiohttp==3.14.3 openai==2.8.1 -r server/companion/requirements-memory-shadow.txt
      - name: Real-store recall, affect, completion and installer regressions
        run: >-
          python -m unittest
          server.tests.test_companion_memory_runtime
          server.tests.test_companion_memory_engine
          server.tests.test_companion_memory_shadow
          server.tests.test_companion_memory_index_cache
          server.tests.test_companion_memory_cache_invalidations
          server.tests.test_companion_memory_cache_lifecycle
          server.tests.test_companion_memory_cache_cleanup
          server.tests.test_companion_memory_state
          server.tests.test_companion_full_migration
          server.tests.test_companion_cognitive_policy
          server.tests.test_companion_cognitive_behavior
          server.tests.test_companion_memory_reflection
          server.tests.test_companion_memory_artifacts
          server.tests.test_companion_reflection_generation
          server.tests.test_companion_time_change
          server.tests.test_companion_memory_emotion
          server.tests.test_companion_memory_management
          server.tests.test_notebook_management
          server.tests.test_companion_request_accounting
          server.tests.test_emotional_system
          server.tests.test_companion_affect
          server.tests.test_companion_character
          server.tests.test_companion_features
          server.tests.test_companion_semantic
          server.tests.test_companion_embedding_admission
          server.tests.test_companion_encoder_concurrency
          server.tests.test_companion_reply
          server.tests.test_companion_jobs
          server.tests.test_companion_continuity
          -v
