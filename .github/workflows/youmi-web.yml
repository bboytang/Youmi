name: Verify Youmi web tools
on:
  push:
    paths:
      - 'integrations/astrbot_plugin_youmi_web/**'
      - 'integrations/tests/test_youmi_web.py'
      - 'integrations/tests/test_youmi_web_authorization.py'
      - 'integrations/tests/test_youmi_network_health.py'
      - 'deploy/youmi-network/**'
      - '.github/workflows/youmi-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aiohttp beautifulsoup4
      - run: python -m unittest integrations.tests.test_youmi_web integrations.tests.test_youmi_web_authorization integrations.tests.test_youmi_network_health -v
      - run: python -m unittest discover -s deploy/youmi-network/tests -v
      - run: node --test deploy/youmi-network/tests/test_wait_for_proxy.js
      - run: python -m compileall -q integrations/astrbot_plugin_youmi_web
      - name: Build and smoke-test the isolated network keeper
        env:
          YOUMI_NETWORK: fixture-network
          SNOWLUMA_VNC_PASSWORD: fixture-password
          YOUMI_NET_KEEPER_IMAGE: youmi-network-ci
          YOUMI_NET_PROXY_CONFIG: /tmp/youmi-fixture-xray.json
          YOUMI_NET_WAIT_SCRIPT: /tmp/youmi-fixture-wait.py
          YOUMI_NET_BROWSER_WAIT_SCRIPT: /tmp/youmi-fixture-wait.js
        run: |
          docker build -t youmi-network-ci deploy/youmi-network
          docker compose -f deploy/astrbot-fusion/compose.yaml -f deploy/youmi-network/tests/compose-fixture.yaml -f deploy/youmi-network/compose.override.yaml config --quiet
          name="youmi-network-ci-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --network none --cap-add NET_ADMIN youmi-network-ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$name")
            if [ "$status" = healthy ]; then break; fi
            sleep 2
          done
          test "$status" = healthy
          docker exec "$name" iptables -t nat -C OUTPUT -p tcp -j YOUMI_NET_TCP
          docker exec "$name" iptables -t mangle -C OUTPUT -p udp -j YOUMI_NET_UDP
      - name: Package web plugin
        run: |
          mkdir web-artifact
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('integrations/astrbot_plugin_youmi_web')
          with ZipFile('web-artifact/youmi-web.zip', 'w') as archive:
              for file in root.iterdir():
                  if file.is_file(): archive.write(file, file.name)
          PY
          docker save youmi-network-ci | gzip -1 > web-artifact/youmi-network-keeper.tar.gz
          sha256sum web-artifact/youmi-web.zip web-artifact/youmi-network-keeper.tar.gz > web-artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Youmi-web-${{ github.sha }}
          path: web-artifact/
