name: Test Youmi Protocol Server

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/youmi-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/youmi-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: a30a5081bfa3c08e7387b9f5d9be77bd957e8175
          path: legacy-memory
          sparse-checkout: server/companion/memory.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install libopus and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0
          python -m pip install -r server/requirements.txt numpy==1.26.4 openai==2.8.1
      - name: Test WebSocket and Opus protocol fixture
        env:
          MIA_MUSIC_TEST_SOURCE: ${{ runner.temp }}/play_music.py
          MIA_LEGACY_MEMORY_SOURCE: ${{ github.workspace }}/legacy-memory/server/companion/memory.py
          MIA_V2_MECHANISM_REPORT: ${{ runner.temp }}/mia-v2-mechanisms.json
          YOUMI_LEGACY_CONTEXT_SOURCE: ${{ runner.temp }}/context-b51be7e.py
          YOUMI_ASR_TEST_SOURCE: ${{ runner.temp }}/doubao_stream.py
          YOUMI_TTS_TEST_SOURCE: ${{ runner.temp }}/huoshan_double_stream.py
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/xinnan-tech/xiaozhi-esp32-server/87c6df77b0220ddbd8fc804f984f83f69f3225e5/main/xiaozhi-server/plugins_func/functions/play_music.py \
            --output "$MIA_MUSIC_TEST_SOURCE"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/bboytang/Youmi/b51be7e770161fe759a192a2996031ebba5e54dc/server/companion/context.py \
            --output "$YOUMI_LEGACY_CONTEXT_SOURCE"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/xinnan-tech/xiaozhi-esp32-server/87c6df77b0220ddbd8fc804f984f83f69f3225e5/main/xiaozhi-server/core/providers/asr/doubao_stream.py \
            --output "$YOUMI_ASR_TEST_SOURCE"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/xinnan-tech/xiaozhi-esp32-server/87c6df77b0220ddbd8fc804f984f83f69f3225e5/main/xiaozhi-server/core/providers/tts/huoshan_double_stream.py \
            --output "$YOUMI_TTS_TEST_SOURCE"
          python -m unittest discover -s server/tests -v
          python -m unittest integrations.tests.test_persona_transport -v
          bash -n server/deploy/install-ubuntu.sh
          python -m py_compile server/deploy/check_wss.py
          python -m server.companion.install_music "$MIA_MUSIC_TEST_SOURCE" --apply
      - name: Upload checked music plugin
        uses: actions/upload-artifact@v4
        with:
          name: Youmi-music-plugin-${{ github.sha }}
          path: ${{ runner.temp }}/play_music.py
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Youmi-v2-mechanisms-${{ github.sha }}
          path: ${{ runner.temp }}/mia-v2-mechanisms.json
          if-no-files-found: warn
